[package]
name = "ssdcache"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ssdcache"
path = "src/main.rs"

[[bin]]
name = "ssdcache-sim"
path = "src/bin/sim.rs"

[dependencies]
io-uring = "0.7.15"
libc = "0.2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
crossbeam-utils = "0.8"
crossbeam-queue = "0.3"
memchr = "2.7"
httparse = "1.10"
rustls = { version = "0.23.40", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-pki-types = "1.14"
rustls-pemfile = "2.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]

[profile.release]
debug = 1
lto = "thin"
codegen-units = 4
panic = "abort"
